name: moonset PR Comment
description: Idempotently create or update the moonset PR Bot comment without checking out PR code.
inputs:
  comment:
    description: Markdown comment body produced by pr-check
    required: true
  state:
    description: Check state produced by pr-check (release, missing, empty, none, or error)
    required: true
  should-comment:
    description: Whether to create a new comment when none exists yet
    required: false
    default: 'true'
  pr-number:
    description: Pull request number (defaults to current pull_request event number)
    required: false
    default: ''
  github-token:
    description: GitHub token with pull-requests:write permission
    required: false
    default: ${{ github.token }}
  bot-login:
    description: Trusted comment author login used when locating existing bot comments
    required: false
    default: 'github-actions[bot]'
  label:
    description: Optional label to add on missing changeset and remove otherwise
    required: false
    default: ''
  fail-on-missing:
    description: Fail the job when state is missing or error
    required: false
    default: 'false'
outputs:
  comment-id:
    description: Created or updated comment ID (empty when skipped)
    value: ${{ steps.comment.outputs.comment-id }}
  action:
    description: Operation performed (created, updated, or skipped)
    value: ${{ steps.comment.outputs.action }}
  audit-event:
    description: Sanitized compact JSON audit event
    value: ${{ steps.comment.outputs.audit-event }}
runs:
  using: composite
  steps:
    - id: comment
      shell: bash
      env:
        COMMENT: ${{ inputs.comment }}
        STATE: ${{ inputs.state }}
        SHOULD_COMMENT: ${{ inputs.should-comment }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        BOT_LOGIN: ${{ inputs.bot-login }}
        LABEL_NAME: ${{ inputs.label }}
        FAIL_ON_MISSING: ${{ inputs.fail-on-missing }}
      run: |
        set -euo pipefail
        now_ms() {
          local raw
          raw="$(date +%s%3N 2>/dev/null || true)"
          case "$raw" in
            ''|*[!0-9]*)
              printf '%s000' "$(date +%s)"
              ;;
            *)
              if [ "${#raw}" -ge 13 ]; then
                printf '%s' "$raw"
              else
                printf '%s000' "$(date +%s)"
              fi
              ;;
          esac
        }
        start_ms="$(now_ms)"
        pr_num="${INPUT_PR_NUMBER:-$EVENT_PR_NUMBER}"
        if [ -z "$pr_num" ]; then
          echo "pr-number is required outside pull_request events" >&2
          exit 1
        fi

        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$tmp_dir"' EXIT
        printf '%s' "$COMMENT" > "$tmp_dir/comment.md"

        existing_id="$(
          gh api --paginate "repos/${REPO}/issues/${pr_num}/comments" \
            | jq -s -r '[.[][] | select(.user.login == env.BOT_LOGIN and ((.body // "") | contains("<!-- moonset-bot:changeset-check -->")))][0].id // empty' \
            | tr -d '\r'
        )"

        comment_id=""
        op="skipped"
        if [ -n "$existing_id" ]; then
          comment_id="$(gh api -X PATCH "repos/${REPO}/issues/comments/${existing_id}" -F "body=@${tmp_dir}/comment.md" --jq '.id' | tr -d '\r')"
          op="updated"
        elif [ "$SHOULD_COMMENT" = "true" ]; then
          comment_id="$(gh api -X POST "repos/${REPO}/issues/${pr_num}/comments" -F "body=@${tmp_dir}/comment.md" --jq '.id' | tr -d '\r')"
          op="created"
        fi

        if [ -n "$LABEL_NAME" ]; then
          if [ "$STATE" = "missing" ]; then
            gh api -X POST "repos/${REPO}/issues/${pr_num}/labels" -f "labels[]=${LABEL_NAME}" >/dev/null
          else
            encoded_label="$(printf '%s' "$LABEL_NAME" | jq -sRr '@uri')"
            gh api -X DELETE "repos/${REPO}/issues/${pr_num}/labels/${encoded_label}" >/dev/null 2>&1 || true
          fi
        fi

        end_ms="$(now_ms)"
        duration=$((end_ms - start_ms))
        if [ "$duration" -lt 0 ]; then duration=0; fi
        err_code=""
        if [ "$FAIL_ON_MISSING" = "true" ] && { [ "$STATE" = "missing" ] || [ "$STATE" = "error" ]; }; then
          err_code="$STATE"
        fi
        audit_json="$(jq -nc \
          --arg repo "$REPO" \
          --arg runId "$RUN_ID" \
          --arg runAttempt "$RUN_ATTEMPT" \
          --arg cmd "pr-comment" \
          --arg res "$op" \
          --argjson duration "$duration" \
          --arg err "$err_code" \
          '{schemaVersion:1,repository:$repo,runId:$runId,runAttempt:$runAttempt,command:$cmd,planFingerprint:null,result:$res,durationMs:$duration,errorCode:(if $err == "" then null else $err end)}' | tr -d '\r')"

        echo "comment-id=$comment_id" >> "$GITHUB_OUTPUT"
        echo "action=$op" >> "$GITHUB_OUTPUT"
        echo "audit-event=$audit_json" >> "$GITHUB_OUTPUT"
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          {
            echo "### moonset pr-comment"
            echo ""
            echo "| Operation | State | Duration (ms) |"
            echo "|---|---|---|"
            echo "| \`$op\` | \`$STATE\` | \`$duration\` |"
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        if [ -n "$err_code" ]; then
          exit 1
        fi
