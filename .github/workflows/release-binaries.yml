name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag name to publish assets for (defaults to GITHUB_REF_NAME)
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: Existing tag name to publish assets for
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: moonset-linux-x64
            ext: ''
          - os: ubuntu-22.04-arm
            asset: moonset-linux-arm64
            ext: ''
          - os: macos-15
            asset: moonset-darwin-arm64
            ext: ''
          - os: windows-latest
            asset: moonset-win32-x64.exe
            ext: '.exe'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.20+65efd5b93'
          core-version: '0.10.20+65efd5b93'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: moon update
      - run: moon check --target native --deny-warn
      - run: moon build --target native --release
      - name: Package and smoke-test binary
        shell: bash
        env:
          ASSET_NAME: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          mkdir -p dist
          src="_build/native/release/build/cmd/moonset/moonset.exe"
          if [ ! -f "$src" ]; then
            src="_build/native/release/build/cmd/moonset/moonset"
          fi
          cp "$src" "dist/$ASSET_NAME"
          chmod +x "dist/$ASSET_NAME"
          "./dist/$ASSET_NAME" --version
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish-release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: Generate SHA256SUMS and upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          if [[ "$tag" != v* ]]; then
            echo "Release tag must start with 'v', got: $tag" >&2
            exit 1
          fi
          (cd dist && sha256sum moonset-* > SHA256SUMS && sha256sum -c SHA256SUMS)
          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT
          version="${tag#v}"
          if changelog="$(gh api -H "Accept: application/vnd.github.raw+json" "repos/${GH_REPO}/contents/CHANGELOG.md?ref=${tag}" 2>/dev/null)"; then
            printf '%s\n' "$changelog" | awk -v ver="$version" '
              /^## / {
                if (found) exit
                header = substr($0, 4)
                sub(/^\[/, "", header)
                sub(/^v/, "", header)
                split(header, parts, /[][[:space:]()]/)
                if (parts[1] == ver) {
                  found = 1
                  next
                }
              }
              found {
                if (!started && $0 ~ /^[[:space:]]*$/) next
                started = 1
                lines[++n] = $0
              }
              END {
                while (n > 0 && lines[n] ~ /^[[:space:]]*$/) n--
                for (i = 1; i <= n; i++) print lines[i]
              }
            ' > "$notes_file"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/moonset-* dist/SHA256SUMS --clobber
          elif [ -s "$notes_file" ]; then
            gh release create "$tag" dist/moonset-* dist/SHA256SUMS --title "$tag" --notes-file "$notes_file"
          else
            gh release create "$tag" dist/moonset-* dist/SHA256SUMS --title "$tag" --generate-notes
          fi
