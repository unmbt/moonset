name: Phase 2 checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.20+65efd5b93'
          core-version: '0.10.20+65efd5b93'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: moon update
      # mizchi/tui@0.10.2 currently pulls packages that still publish the
      # legacy moon.mod.json metadata format.
      - name: Migrate legacy registry package manifests
        run: python scripts/migrate-registry-manifests.py
      - run: moon check --target native --deny-warn
      - run: moon test --target native
      - run: moon build --target native --release
      - run: moon run scripts/embed-schema.mbtx --check
      - run: moon run scripts/cli-integration.mbtx
      - run: moon info
      - run: moon fmt --check
      - run: git diff --exit-code
