name: Phase 2 checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.20+65efd5b93'
          core-version: '0.10.20+65efd5b93'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: moon update
      # Package archives are downloaded lazily by `moon check`, so migrate
      # after each preflight download until the dependency graph is complete.
      - name: Prefetch and migrate legacy registry packages
        shell: bash
        run: |
          for attempt in $(seq 1 12); do
            moon check --target native --deny-warn && break || true
            python scripts/migrate-registry-manifests.py
          done
      - run: moon check --target native --deny-warn
      - run: moon test --target native
      - run: moon build --target native --release
      - run: moon run scripts/embed-schema.mbtx --check
      - run: moon run scripts/lint-workflows.mbtx
      - run: moon run scripts/cli-integration.mbtx
      - run: moon info
      - run: moon fmt --check
      - run: git diff --exit-code

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install and run actionlint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          gh release download -R rhysd/actionlint -p 'actionlint_*_linux_amd64.tar.gz' -D "$tmp_dir"
          tar -xzf "$tmp_dir"/actionlint_*_linux_amd64.tar.gz -C "$tmp_dir"
          "$tmp_dir/actionlint"
          "$tmp_dir/actionlint" docs/examples/workflows/*.yml
