name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-15, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.20+65efd5b93'
          core-version: '0.10.20+65efd5b93'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: moon update
      - run: moon run scripts/embed-schema.mbtx --check
      - run: moon run scripts/gen-version.mbtx --check
      - run: moon run scripts/lint-workflows.mbtx
      - run: moon check --target native --deny-warn
      - run: moon test --target native
      - run: moon check --target wasm-gc --deny-warn
      - run: moon test --target wasm-gc
      - run: moon build --target native --release
      - run: moon package
      - run: moon run scripts/cli-integration.mbtx
      - run: moon info
      - run: moon fmt --check
      - name: Verify clean working tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git ls-files --eol --modified
            exit 1
          fi

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install and run actionlint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          gh release download -R rhysd/actionlint -p 'actionlint_*_linux_amd64.tar.gz' -D "$tmp_dir"
          tar -xzf "$tmp_dir"/actionlint_*_linux_amd64.tar.gz -C "$tmp_dir"
          "$tmp_dir/actionlint"
          "$tmp_dir/actionlint" docs/examples/workflows/*.yml
