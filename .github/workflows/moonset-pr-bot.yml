name: moonset PR Bot

on:
  pull_request_target:
    types: [ opened, synchronize, reopened, ready_for_review ]

concurrency:
  group: moonset-pr-bot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    if: ${{ !startsWith(github.event.pull_request.head.ref, 'moonset-release/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      comment: ${{ steps.check.outputs.comment }}
      state: ${{ steps.check.outputs.state }}
      should-comment: ${{ steps.check.outputs.should-comment }}
    steps:
      - name: Checkout trusted base branch for building CLI
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Checkout PR head for read-only inspection (Fork-safe)
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 0
          path: pr
          persist-credentials: false
      - uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.20+65efd5b93'
          core-version: '0.10.20+65efd5b93'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build moonset from trusted base branch only
        shell: bash
        working-directory: trusted
        run: |
          set -euo pipefail
          moon update
          moon check --target native --deny-warn
          moon build --target native --release
          src="_build/native/release/build/cmd/moonset/moonset.exe"
          if [ ! -f "$src" ]; then
            src="_build/native/release/build/cmd/moonset/moonset"
          fi
          cp "$src" moonset-cli
          chmod +x moonset-cli
      - id: check
        uses: ./trusted/pr-check
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-repo: ${{ github.event.pull_request.head.repo.full_name }}
          head-ref: ${{ github.event.pull_request.head.ref }}
          working-directory: pr
          binary-path: trusted/moonset-cli

  comment:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout trusted base action runner
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: pr-comment
          persist-credentials: false
      - uses: ./pr-comment
        with:
          comment: ${{ needs.check.outputs.comment }}
          state: ${{ needs.check.outputs.state }}
          should-comment: ${{ needs.check.outputs.should-comment }}
          fail-on-missing: 'false'
