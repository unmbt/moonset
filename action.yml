name: moonset Release Action
description: Create/update release PRs (mode=version-pr) or idempotently publish and tag releases (mode=publish).
inputs:
  mode:
    description: Action mode ('version-pr' or 'publish')
    required: false
    default: 'version-pr'
  version:
    description: moonset release tag to download
    required: false
    default: ''
  binary-path:
    description: Optional trusted local moonset binary path
    required: false
    default: ''
  working-directory:
    description: Workspace root relative to GITHUB_WORKSPACE
    required: false
    default: '.'
  branch:
    description: Release PR branch name (defaults to moonset-release/<base>)
    required: false
    default: ''
  title:
    description: Release PR title
    required: false
    default: 'chore: release packages'
  commit-message:
    description: Release PR commit message
    required: false
    default: 'chore: release'
  github-token:
    description: GitHub token for pushing release branch and managing PR
    required: false
    default: ${{ github.token }}
outputs:
  has-changesets:
    description: Whether pending changesets were found (version-pr mode)
    value: ${{ steps.run.outputs.has-changesets }}
  pull-request-number:
    description: Created or updated release PR number (version-pr mode)
    value: ${{ steps.run.outputs.pull-request-number }}
  published:
    description: Whether packages were published (publish mode)
    value: ${{ steps.run.outputs.published }}
  tags:
    description: Space-separated list of created/planned tags
    value: ${{ steps.run.outputs.tags }}
runs:
  using: composite
  steps:
    - id: setup
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_BINARY_PATH: ${{ inputs.binary-path }}
        ACTION_REF: ${{ github.action_ref }}
        GH_TOKEN: ${{ inputs.github-token }}
        GITHUB_ACTION_REPOSITORY: ${{ github.action_repository || 'unmbt/moonset' }}
      run: |
        bash "${{ github.action_path }}/setup/install.sh"

    - id: run
      shell: bash
      env:
        MOONSET_BIN: ${{ steps.setup.outputs.path }}
        MODE: ${{ inputs.mode }}
        WORK_DIR: ${{ inputs.working-directory }}
        INPUT_BRANCH: ${{ inputs.branch }}
        BASE_REF: ${{ github.ref_name }}
        PR_TITLE: ${{ inputs.title }}
        COMMIT_MSG: ${{ inputs.commit-message }}
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$tmp_dir"' EXIT

        if [ "$MODE" = "version-pr" ]; then
          "$MOONSET_BIN" --cwd "$WORK_DIR" status --output json > "$tmp_dir/status.json"
          cs_count="$(jq -r '.changesets | length' "$tmp_dir/status.json")"
          if [ "$cs_count" -eq 0 ]; then
            echo "has-changesets=false" >> "$GITHUB_OUTPUT"
            echo "pull-request-number=" >> "$GITHUB_OUTPUT"
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "tags=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          "$MOONSET_BIN" --cwd "$WORK_DIR" version --dry-run --json > "$tmp_dir/plan.json"
          "$MOONSET_BIN" --cwd "$WORK_DIR" version --no-commit --json > "$tmp_dir/applied.json"

          branch="${INPUT_BRANCH:-moonset-release/${BASE_REF}}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "$COMMIT_MSG"
          fi
          git push -f origin "HEAD:${branch}"

          {
            echo "## Release Preview"
            echo ""
            echo "| Package | Version | Bump |"
            echo "|---|---|---|"
            jq -r '.analysis.releases[] | "| `\(.unitId)` | `\(.oldVersion)` → `\(.newVersion)` | `\(.level)` |"' "$tmp_dir/plan.json"
            echo ""
            echo "_Generated by moonset._"
          } > "$tmp_dir/pr-body.md"

          existing_pr="$(gh pr list -R "$REPO" --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" -R "$REPO" --title "$PR_TITLE" --body-file "$tmp_dir/pr-body.md"
            pr_number="$existing_pr"
          else
            pr_url="$(gh pr create -R "$REPO" --base "$BASE_REF" --head "$branch" --title "$PR_TITLE" --body-file "$tmp_dir/pr-body.md")"
            pr_number="$(printf '%s' "$pr_url" | awk -F/ '{print $NF}')"
          fi

          echo "has-changesets=true" >> "$GITHUB_OUTPUT"
          echo "pull-request-number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "published=false" >> "$GITHUB_OUTPUT"
          echo "tags=" >> "$GITHUB_OUTPUT"
        elif [ "$MODE" = "publish" ]; then
          state_file="$WORK_DIR/.moonset/release-state.json"
          if [ ! -f "$state_file" ]; then
            echo "No release state found at $state_file; skipping publish."
            echo "has-changesets=false" >> "$GITHUB_OUTPUT"
            echo "pull-request-number=" >> "$GITHUB_OUTPUT"
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "tags=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          "$MOONSET_BIN" --cwd "$WORK_DIR" tag --dry-run --json > "$tmp_dir/tags.json"
          planned_tags="$(jq -r '.tags[]?' "$tmp_dir/tags.json")"
          remote_tags="$(git ls-remote --tags origin)"

          needs_publish="false"
          tags_summary=""
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            if [ -z "$tags_summary" ]; then
              tags_summary="$t"
            else
              tags_summary="$tags_summary $t"
            fi
            if ! printf '%s\n' "$remote_tags" | grep -Fq "refs/tags/${t}"; then
              needs_publish="true"
            fi
          done <<EOF
$planned_tags
EOF

          if [ "$needs_publish" = "false" ]; then
            echo "All planned tags already exist on origin; skipping duplicate publish."
            echo "has-changesets=false" >> "$GITHUB_OUTPUT"
            echo "pull-request-number=" >> "$GITHUB_OUTPUT"
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "tags=$tags_summary" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          "$MOONSET_BIN" --cwd "$WORK_DIR" publish --yes --no-tag --json > "$tmp_dir/publish.json"
          "$MOONSET_BIN" --cwd "$WORK_DIR" tag --push --yes --json > "$tmp_dir/pushed-tags.json"
          pushed_list="$(jq -r '(.created // []) | join(" ")' "$tmp_dir/pushed-tags.json")"

          echo "has-changesets=false" >> "$GITHUB_OUTPUT"
          echo "pull-request-number=" >> "$GITHUB_OUTPUT"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "tags=$pushed_list" >> "$GITHUB_OUTPUT"
        else
          echo "Unsupported moonset action mode: $MODE (expected version-pr or publish)" >&2
          exit 1
        fi
