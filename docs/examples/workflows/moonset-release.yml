name: moonset release

on:
  push:
    branches:
      - main

concurrency:
  group: moonset-release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: moonset-publish
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.22+124d61d05'
          core-version: '0.10.22+124d61d05'
      - uses: unmbt/moonset@v1
        with:
          mode: publish
          mooncakes-credentials: ${{ secrets.MOONCAKES_CREDENTIALS }}

  version-pr:
    needs: publish
    if: always() && needs.publish.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has-changesets: ${{ steps.release.outputs.has-changesets }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: release
        uses: unmbt/moonset@v1
        with:
          mode: version-pr
